[project]
name = "four-in-a-row"
version = "0.1.0"
description = "Four in a Row with hot-seat, computer and network play"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
four-in-a-row = "four_in_a_row.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
four_in_a_row = ["assets/*.png"]

[tool.uv]
python-preference = "only-system"

[tool.ruff]
extend-exclude = ["garbage.py", "salvege.py"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "T201", "S311", "FBT", "PLR2004", "INP001", "EXE002"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ERA001", "PERF402"]
"src/four_in_a_row/i18n.py" = ["RUF001"]  # Hebrew text
